spring.application.name=library-backend

# MySQL Database Connection
spring.datasource.url=jdbc:mysql://localhost:3306/library_db
spring.datasource.username=root
spring.datasource.password=root

# This tells Spring to automatically create tables based on your Java code
spring.jpa.hibernate.ddl-auto=update

# This prints the SQL queries to the console, which is useful for debugging
spring.jpa.show-sql=true
debug=true

jwt.secret=YourSuperSecretKeyForJWTsWhichIsLongAndSecure

# Set the server port to 8088 to avoid conflicts with other services
server.port=8088

