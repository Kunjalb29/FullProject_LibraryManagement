version: '3.8'

services:
  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: your_secret_password  # Use a strong password
      MYSQL_DATABASE: library_db
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306" # Expose MySQL port to host for Workbench access

  # Backend Spring Boot Service
  backend:
    build: ./backend
    container_name: spring_backend
    ports:
      - "8088:8088"
    environment:
      # These variables override application.properties for Docker
      - spring.datasource.url=jdbc:mysql://db:3306/library_db
      - spring.datasource.username=root
      - spring.datasource.password=your_secret_password
      - spring.jpa.hibernate.ddl-auto=update
    depends_on:
      - db

  # Frontend React Service
  frontend:
    build: ./frontend
    container_name: react_frontend
    ports:
      - "80:80" # Maps host port 80 to container port 80
    depends_on:
      - backend

volumes:
  mysql_data: